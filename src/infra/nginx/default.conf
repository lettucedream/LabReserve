resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;
upstream availability_api {
    zone availability_api 64k;
    server availability:8000 resolve;
}
upstream booking_api {
    zone booking_api 64k;
    server booking:8000 resolve;
}
upstream waiting_api {
    zone waiting_api 64k;
    server waiting-list:8000 resolve;
}
upstream notification_api {
    zone notification_api 64k;
    server notification:8000 resolve;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;
    client_max_body_size 32k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cache-Control "no-store" always;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 12s;
    proxy_send_timeout 12s;
    proxy_next_upstream off;
    proxy_redirect off;
    error_page 502 504 =503 @unavailable;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"gateway"}';
    }
    location /api/availability/ { proxy_pass http://availability_api/; }
    location /api/booking/ { proxy_pass http://booking_api/; }
    location /api/waiting-list/ { proxy_pass http://waiting_api/; }
    location /api/notification/ { proxy_pass http://notification_api/; }
    location /api/ {
        default_type application/json;
        return 404 '{"detail":"Percorso API non trovato"}';
    }
    location @unavailable {
        default_type application/json;
        return 503 '{"detail":"Servizio temporaneamente non disponibile. Riprova tra poco."}';
    }
    location ~ ^/[^/]+\.mjs$ {
        types { text/javascript mjs; }
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }
}

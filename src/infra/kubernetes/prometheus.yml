global:
  scrape_interval: 10s
  scrape_timeout: 8s
  evaluation_interval: 10s
rule_files:
  - /etc/prometheus/rules.yml
  - /etc/prometheus/predictors.yml
scrape_configs:
  - job_name: labreserve-api
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [labreserve]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_component]
        regex: api
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: api
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: job
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: traefik
    static_configs:
      - targets: [traefik:9100]
  - job_name: kubernetes-cadvisor
    scheme: https
    authorization:
      type: Bearer
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      server_name: kubernetes.default.svc
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        target_label: __metrics_path__
        replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node
    metric_relabel_configs:
      - source_labels: [namespace]
        regex: labreserve
        action: keep
      - source_labels: [container]
        regex: availability|booking|waiting-list|notification|availability-worker|booking-worker|waiting-list-worker|notification-worker|postgres|kafka|frontend|traefik|prometheus
        action: keep
      - source_labels: [container]
        target_label: service

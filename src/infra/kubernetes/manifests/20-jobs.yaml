apiVersion: "batch/v1"
kind: "Job"
metadata:
  name: "kafka-topics"
  labels:
    app.kubernetes.io/part-of: "labreserve"
  namespace: "labreserve"
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: "kafka-topics"
        component: "init"
        app.kubernetes.io/part-of: "labreserve"
    spec:
      restartPolicy: "OnFailure"
      automountServiceAccountToken: false
      containers:
        -
          name: "topics"
          image: "labreserve-booking"
          imagePullPolicy: "Never"
          command:
            - "sh"
            - "-ec"
            - "python -m labreserve_messaging.wait_ready broker && python -m labreserve_messaging.init_topics"
          envFrom:
            -
              configMapRef:
                name: "labreserve-config"
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"

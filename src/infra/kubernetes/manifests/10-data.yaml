apiVersion: "v1"
kind: "Service"
metadata:
  name: "postgres"
  labels:
    app.kubernetes.io/part-of: "labreserve"
  namespace: "labreserve"
spec:
  selector:
    app: "postgres"
  ports:
    -
      name: "tcp"
      port: 5432
      targetPort: 5432
  clusterIP: "None"
  publishNotReadyAddresses: true
---
apiVersion: "apps/v1"
kind: "StatefulSet"
metadata:
  name: "postgres"
  labels:
    app.kubernetes.io/part-of: "labreserve"
  namespace: "labreserve"
spec:
  serviceName: "postgres"
  replicas: 1
  selector:
    matchLabels:
      app: "postgres"
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: "Retain"
    whenScaled: "Retain"
  template:
    metadata:
      labels:
        app: "postgres"
        component: "data"
        app.kubernetes.io/part-of: "labreserve"
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
      terminationGracePeriodSeconds: 60
      containers:
        -
          name: "postgres"
          image: "postgres:18.6-bookworm"
          imagePullPolicy: "IfNotPresent"
          ports:
            -
              name: "postgres"
              containerPort: 5432
          env:
            -
              name: "POSTGRES_USER"
              value: "labreserve_admin"
            -
              name: "POSTGRES_DB"
              value: "postgres"
            -
              name: "POSTGRES_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: "labreserve-db"
                  key: "POSTGRES_ADMIN_PASSWORD"
            -
              name: "AVAILABILITY_DB_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: "labreserve-db"
                  key: "AVAILABILITY_DB_PASSWORD"
            -
              name: "BOOKING_DB_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: "labreserve-db"
                  key: "BOOKING_DB_PASSWORD"
            -
              name: "WAITING_LIST_DB_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: "labreserve-db"
                  key: "WAITING_LIST_DB_PASSWORD"
            -
              name: "NOTIFICATION_DB_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: "labreserve-db"
                  key: "NOTIFICATION_DB_PASSWORD"
          volumeMounts:
            -
              name: "data"
              mountPath: "/var/lib/postgresql"
            -
              name: "init"
              mountPath: "/docker-entrypoint-initdb.d"
              readOnly: true
            -
              name: "socket"
              mountPath: "/var/run/postgresql"
            -
              name: "tmp"
              mountPath: "/tmp"
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          startupProbe:
            tcpSocket:
              port: 5432
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 5432
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5432
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        -
          name: "init"
          configMap:
            name: "postgres-init"
            defaultMode: 292
        -
          name: "socket"
          emptyDir: {}
        -
          name: "tmp"
          emptyDir: {}
  volumeClaimTemplates:
    -
      metadata:
        name: "data"
      spec:
        accessModes:
          - "ReadWriteOnce"
        storageClassName: "standard"
        resources:
          requests:
            storage: "2Gi"
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "kafka-headless"
  labels:
    app.kubernetes.io/part-of: "labreserve"
  namespace: "labreserve"
spec:
  selector:
    app: "kafka"
  ports:
    -
      name: "tcp"
      port: 9092
      targetPort: 9092
    -
      name: "controller"
      port: 9093
      targetPort: 9093
  clusterIP: "None"
  publishNotReadyAddresses: true
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "kafka"
  labels:
    app.kubernetes.io/part-of: "labreserve"
  namespace: "labreserve"
spec:
  selector:
    app: "kafka"
  ports:
    -
      name: "tcp"
      port: 9092
      targetPort: 9092
---
apiVersion: "apps/v1"
kind: "StatefulSet"
metadata:
  name: "kafka"
  labels:
    app.kubernetes.io/part-of: "labreserve"
  namespace: "labreserve"
spec:
  serviceName: "kafka-headless"
  replicas: 1
  selector:
    matchLabels:
      app: "kafka"
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: "Retain"
    whenScaled: "Retain"
  template:
    metadata:
      labels:
        app: "kafka"
        component: "data"
        app.kubernetes.io/part-of: "labreserve"
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      terminationGracePeriodSeconds: 60
      containers:
        -
          name: "kafka"
          image: "apache/kafka:4.4.0"
          imagePullPolicy: "IfNotPresent"
          ports:
            -
              name: "kafka"
              containerPort: 9092
            -
              name: "controller"
              containerPort: 9093
          env:
            -
              name: "CLUSTER_ID"
              value: "bGFicmVzZXJ2ZS1rdWJlMQ"
            -
              name: "KAFKA_NODE_ID"
              value: "1"
            -
              name: "KAFKA_PROCESS_ROLES"
              value: "broker,controller"
            -
              name: "KAFKA_LISTENERS"
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            -
              name: "KAFKA_ADVERTISED_LISTENERS"
              value: "PLAINTEXT://kafka:9092"
            -
              name: "KAFKA_LISTENER_SECURITY_PROTOCOL_MAP"
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            -
              name: "KAFKA_CONTROLLER_LISTENER_NAMES"
              value: "CONTROLLER"
            -
              name: "KAFKA_CONTROLLER_QUORUM_VOTERS"
              value: "1@kafka-0.kafka-headless:9093"
            -
              name: "KAFKA_INTER_BROKER_LISTENER_NAME"
              value: "PLAINTEXT"
            -
              name: "KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR"
              value: "1"
            -
              name: "KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR"
              value: "1"
            -
              name: "KAFKA_TRANSACTION_STATE_LOG_MIN_ISR"
              value: "1"
            -
              name: "KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR"
              value: "1"
            -
              name: "KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR"
              value: "1"
            -
              name: "KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS"
              value: "0"
            -
              name: "KAFKA_AUTO_CREATE_TOPICS_ENABLE"
              value: "false"
            -
              name: "KAFKA_LOG_DIRS"
              value: "/var/lib/kafka/data"
            -
              name: "KAFKA_HEAP_OPTS"
              value: "-Xms256m -Xmx512m"
          volumeMounts:
            -
              name: "data"
              mountPath: "/var/lib/kafka/data"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - "ALL"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          startupProbe:
            tcpSocket:
              port: 9092
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 9092
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9092
            periodSeconds: 10
            failureThreshold: 6
  volumeClaimTemplates:
    -
      metadata:
        name: "data"
      spec:
        accessModes:
          - "ReadWriteOnce"
        storageClassName: "standard"
        resources:
          requests:
            storage: "2Gi"

apiVersion: "v1"
kind: "Service"
metadata:
  name: "availability"
  labels:
    app.kubernetes.io/part-of: "labreserve"
  namespace: "labreserve"
spec:
  selector:
    app: "availability"
  ports:
    -
      name: "http"
      port: 8000
      targetPort: 8000
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "availability"
  labels:
    app.kubernetes.io/part-of: "labreserve"
  namespace: "labreserve"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "availability"
  template:
    metadata:
      labels:
        app: "availability"
        component: "api"
        app.kubernetes.io/part-of: "labreserve"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        -
          name: "availability"
          image: "labreserve-availability"
          imagePullPolicy: "Never"
          command:
            - "python"
            - "-m"
            - "uvicorn"
            - "app.main:app"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--root-path"
            - "/api/availability"
          envFrom:
            -
              configMapRef:
                name: "labreserve-config"
          env:
            -
              name: "DB_NAME"
              value: "availability_db"
            -
              name: "DB_USER"
              value: "availability_user"
            -
              name: "DB_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: "labreserve-db"
                  key: "AVAILABILITY_DB_PASSWORD"
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          ports:
            -
              name: "api"
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: "/ready"
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: "/health"
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: "/health"
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
      initContainers:
        -
          name: "wait-database"
          image: "labreserve-availability"
          imagePullPolicy: "Never"
          command:
            - "python"
            - "-m"
            - "labreserve_messaging.wait_ready"
            - "database"
          envFrom:
            -
              configMapRef:
                name: "labreserve-config"
          env:
            -
              name: "DB_NAME"
              value: "availability_db"
            -
              name: "DB_USER"
              value: "availability_user"
            -
              name: "DB_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: "labreserve-db"
                  key: "AVAILABILITY_DB_PASSWORD"
          resources:
            requests:
              cpu: "20m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
---

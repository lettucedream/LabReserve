global:
  scrape_interval: 10s
  scrape_timeout: 8s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules.yml
  - /etc/prometheus/predictors.yml

scrape_configs:
  - job_name: availability
    static_configs:
      - targets: [availability:8000]
  - job_name: booking
    static_configs:
      - targets: [booking:8000]
  - job_name: waiting-list
    static_configs:
      - targets: [waiting-list:8000]
  - job_name: notification
    static_configs:
      - targets: [notification:8000]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_project]
        regex: labreserve
        action: keep
      - source_labels: [container_label_com_docker_compose_service]
        regex: .+
        action: keep
      - source_labels: [container_label_com_docker_compose_service]
        target_label: service
      - action: labeldrop
        regex: container_label_.*

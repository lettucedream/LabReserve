name: labreserve

x-availability: &availability
  image: labreserve-availability
  build:
    context: .
    dockerfile: services/availability/Dockerfile
  environment: &availability-environment
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: availability_db
    DB_USER: availability_user
    DB_PASSWORD: ${AVAILABILITY_DB_PASSWORD:-DemoAvailability2026!}
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    WEATHER_LATITUDE: ${WEATHER_LATITUDE:-37.5253}
    WEATHER_LONGITUDE: ${WEATHER_LONGITUDE:-15.0722}
    WEATHER_TIMEOUT_SECONDS: ${WEATHER_TIMEOUT_SECONDS:-4}
    WEATHER_CACHE_SECONDS: ${WEATHER_CACHE_SECONDS:-600}
    WEATHER_MAX_AGE_SECONDS: ${WEATHER_MAX_AGE_SECONDS:-3600}
    WEATHER_RETRY_SECONDS: ${WEATHER_RETRY_SECONDS:-60}

x-booking: &booking
  image: labreserve-booking
  build:
    context: .
    dockerfile: services/booking/Dockerfile
  environment:
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: booking_db
    DB_USER: booking_user
    DB_PASSWORD: ${BOOKING_DB_PASSWORD:-DemoBooking2026!}
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    BOOKING_TIMEOUT_SECONDS: "60"

x-waiting-list: &waiting-list
  image: labreserve-waiting-list
  build:
    context: .
    dockerfile: services/waiting-list/Dockerfile
  environment:
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: waiting_list_db
    DB_USER: waiting_list_user
    DB_PASSWORD: ${WAITING_LIST_DB_PASSWORD:-DemoWaitingList2026!}
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092

x-notification: &notification
  image: labreserve-notification
  build:
    context: .
    dockerfile: services/notification/Dockerfile
  environment:
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: notification_db
    DB_USER: notification_user
    DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-DemoNotification2026!}
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092

x-worker-health: &worker-health
  test: ["CMD", "python", "-m", "labreserve_messaging.health"]
  interval: 5s
  timeout: 5s
  start_period: 20s
  retries: 12

x-api-health: &api-health
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
  interval: 5s
  timeout: 3s
  start_period: 5s
  retries: 6

services:
  prometheus:
    image: prom/prometheus:v3.13.5@sha256:aafa9d694e6a883c02db516d9f6e5b84e14195f49a2a6456a4cca815edda72b9
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=21d
      - --storage.tsdb.retention.size=3GB
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
    restart: unless-stopped

  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.6@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
    command:
      - --docker_only=true
      - --containerd=/rootfs/run/containerd/containerd.sock
      - --containerd-namespace=k8s.io
      - --disable_root_cgroup_stats=true
      - --enable_metrics=cpu,memory
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
      - --housekeeping_interval=5s
      - --max_housekeeping_interval=5s
      - --allow_dynamic_housekeeping=false
    cgroup: host
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - type: bind
        source: /
        target: /rootfs
        read_only: true
      - type: bind
        source: /sys
        target: /sys
        read_only: true
      - type: bind
        source: /var/lib/docker
        target: /var/lib/docker
        read_only: true
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 12
    restart: unless-stopped

  gateway:
    image: labreserve-gateway
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      availability:
        condition: service_healthy
      booking:
        condition: service_healthy
      waiting-list:
        condition: service_healthy
      notification:
        condition: service_healthy

  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: labreserve_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-DemoPostgres2026!}
      AVAILABILITY_DB_PASSWORD: ${AVAILABILITY_DB_PASSWORD:-DemoAvailability2026!}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:-DemoBooking2026!}
      WAITING_LIST_DB_PASSWORD: ${WAITING_LIST_DB_PASSWORD:-DemoWaitingList2026!}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-DemoNotification2026!}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 3s
      start_period: 10s
      retries: 20

  kafka:
    image: apache/kafka:4.4.0
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 12

  kafka-init:
    <<: *booking
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    command: ["python", "-m", "labreserve_messaging.init_topics"]
    depends_on:
      kafka:
        condition: service_healthy

  availability-init:
    <<: *availability
    environment:
      <<: *availability-environment
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-LabReserveDemo2026!}
    command: ["python", "-m", "app.bootstrap"]
    depends_on:
      postgres:
        condition: service_healthy

  availability:
    <<: *availability
    depends_on:
      availability-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${AVAILABILITY_PORT:-8001}:8000"
    healthcheck: *api-health

  availability-worker:
    <<: *availability
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    stop_grace_period: 15s
    depends_on:
      availability-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    healthcheck: *worker-health

  booking-init:
    <<: *booking
    command: ["python", "-m", "app.bootstrap"]
    depends_on:
      postgres:
        condition: service_healthy

  booking:
    <<: *booking
    depends_on:
      booking-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${BOOKING_PORT:-8002}:8000"
    healthcheck: *api-health

  booking-worker:
    <<: *booking
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    stop_grace_period: 15s
    depends_on:
      booking-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    healthcheck: *worker-health

  waiting-list-init:
    <<: *waiting-list
    command: ["python", "-m", "app.bootstrap"]
    depends_on:
      postgres:
        condition: service_healthy

  waiting-list:
    <<: *waiting-list
    depends_on:
      waiting-list-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${WAITING_LIST_PORT:-8003}:8000"
    healthcheck: *api-health

  waiting-list-worker:
    <<: *waiting-list
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    stop_grace_period: 15s
    depends_on:
      waiting-list-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    healthcheck: *worker-health

  notification-init:
    <<: *notification
    command: ["python", "-m", "app.bootstrap"]
    depends_on:
      postgres:
        condition: service_healthy

  notification:
    <<: *notification
    depends_on:
      notification-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${NOTIFICATION_PORT:-8004}:8000"
    healthcheck: *api-health

  notification-worker:
    <<: *notification
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    stop_grace_period: 15s
    depends_on:
      notification-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    healthcheck: *worker-health

volumes:
  postgres_data:
  kafka_data:
  prometheus_data:
